name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters

  browser-acceptance:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: autoplay-off_segments-off
            autoplay: "0"
            segments: "0"
          - profile: autoplay-on_segments-off
            autoplay: "1"
            segments: "0"
          - profile: autoplay-off_segments-on
            autoplay: "0"
            segments: "1"
          - profile: autoplay-on_segments-on
            autoplay: "1"
            segments: "1"
    env:
      VITE_HOMEPAGE_AUTOPLAYER: ${{ matrix.autoplay }}
      VITE_SEAMLESS_YEAR_SEGMENTS: ${{ matrix.segments }}
      PIXILATION_ACCEPTANCE_PROFILE: ${{ matrix.profile }}
      PIXILATION_EXPECT_CLEAN_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:browser:matrix
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.profile }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
